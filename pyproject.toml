[project]
name = "fondary"
version = "0.1.0"
description = "Alignement de chants OpenSong : catalogue Chant / Version / Fichier"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "charset-normalizer>=3.0",
    "unidecode>=1.3",
    "lingua-language-detector>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "tabulate>=0.9",
    "rapidfuzz>=3.0",
    "typer>=0.12",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fondary = "fondary.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fondary*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
